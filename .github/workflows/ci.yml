name: CI

# shell, js, e2e and docker run side by side. ci-ok is the one check that says whether all of them passed, so a job
# added or renamed here changes nothing outside this file.
#
# The public repository runs CI on every push, which is free. The private one pays for its minutes, so a push there
# skips every job, ci-ok included. It runs CI on a pull request and by hand (workflow_dispatch), which a release does
# for the release commit and the baseline commit. A change has passed the same checks locally before it lands.
# The skipped check runs a push leaves answer nothing: tools/ci/wait.sh ignores them.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request makes the older run pointless, so it is cancelled. Every push to main runs
# to the end: the run id in its group name keeps two pushes from queueing behind each other, where GitHub would drop
# the older one. The event is in the name too: in the private repository a push to the branch starts a skipped run that
# would otherwise cancel the dispatched run of the same branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell:
    # no Node: the checks that need no install run first and fastest
    if: ${{ github.event_name != 'push' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts parse
        run: tools/ci/shell-lint.sh
      - name: Shell suites
        # the maintenance helper scenarios run four at a time. The publish script is private-only, so the public
        # snapshot has no test for it.
        if: ${{ !cancelled() }}
        run: bash tools/check.sh sh
      - name: Logs of the failed suites
        if: ${{ failure() }}
        run: |
          for rc in "${TMPDIR:-/tmp}"/check.*/sh-*.rc; do
            [[ -e $rc ]] && [[ $(<"$rc") != 0 ]] || continue
            echo "::group::${rc%.rc}.log"
            cat "${rc%.rc}.log"
            echo "::endgroup::"
          done

  js:
    if: ${{ github.event_name != 'push' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      # a red step does not hide the ones after it: a type error still shows the failing tests
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  e2e:
    # the built app in a real browser: every page at desktop and phone width, no console or network errors
    if: ${{ github.event_name != 'push' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  docker:
    if: ${{ github.event_name != 'push' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t banking-app:ci .
      - name: Smoke test
        # runs the image the way docker-compose.yml does: read-only root, no capabilities,
        # named volumes for the database and the app secret
        run: |
          docker run -d --name app -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp:noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v ci-data:/data -v ci-secrets:/secrets -e APP_SECRET_FILE=/secrets/app_secret banking-app:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          # the app created its own secret, readable by its owner only
          docker exec app stat -c '%a %U' /secrets/app_secret | tee /dev/stderr | grep -qx '600 node'
          docker exec app stat -c '%a %U' /secrets | tee /dev/stderr | grep -qx '700 node'
          curl -fsS localhost:8080/api/auth/state | grep '"needsSetup":true'
          CODE=$(docker exec app node --disable-warning=ExperimentalWarning dist/node.js setup-code | tail -1)
          H=(-H 'Content-Type: application/json' -H 'X-Requested-With: fetch')
          curl -fsS -c jar "${H[@]}" -d "{\"code\":\"$CODE\",\"username\":\"ci-admin\",\"displayName\":\"CI\",\"password\":\"ci-salasana-123456\"}" localhost:8080/api/auth/setup
          curl -fsS -b jar localhost:8080/api/admin/instance | grep '"secret":{"available":true}'
          # setup wizard: key generated in the container, only the certificate comes out
          curl -fsS -b jar "${H[@]}" -X POST localhost:8080/api/admin/bank-app/key | grep '"hasCertificate":true'
          curl -fsS -b jar localhost:8080/api/admin/bank-app/certificate -o ci.crt
          openssl x509 -in ci.crt -noout -subject -enddate
          if grep -q "PRIVATE KEY" ci.crt; then echo "private key leaked"; exit 1; fi
          docker logs app
      - name: Compose file
        # the port, address and name keys resolve, also for IPv6 and an empty Caddy address
        run: |
          docker compose config -q
          INSTANCE_NAME=ci-x HOST_PORT=8085 BIND_ADDRESS=::1 docker compose config | grep -E 'container_name: ci-x|image: ci-x:latest|host_ip: ::1|published: "8085"'
          COMPOSE_PROFILES=caddy CADDY_ADDRESS=127.0.0.2 docker compose config | grep -q 'host_ip: 127.0.0.2'
          COMPOSE_PROFILES=caddy docker compose config | grep -q 'published: "443"'
          COMPOSE_PROFILES=caddy CADDY_ADDRESS='[::1]' docker compose config | grep -q 'host_ip: ::1'
      - name: Two instances side by side
        # the compose file twice, as two projects on one host: own container, image, volumes and port.
        # One cookie jar is logged in to both, which holds only while the cookie names differ.
        run: |
          H=(-H 'Content-Type: application/json' -H 'X-Requested-With: fetch')
          up() { # name port
            docker tag banking-app:ci "$1:latest"
            INSTANCE_NAME=$1 COMPOSE_PROJECT_NAME=$1 HOST_PORT=$2 docker compose up -d --no-build banking
            for i in $(seq 1 30); do docker exec "$1" wget -qO- http://127.0.0.1:8080/api/health && break; sleep 1; done
            curl -fsS "localhost:$2/api/health"
          }
          up ci-a 8081
          up ci-b 8082
          docker volume ls -q | grep -x ci-a_banking-data
          docker volume ls -q | grep -x ci-b_banking-data
          for spec in "ci-a 8081" "ci-b 8082"; do
            set -- $spec
            CODE=$(docker exec "$1" node --disable-warning=ExperimentalWarning dist/node.js setup-code | tail -1)
            curl -fsS -b jar -c jar "${H[@]}" -d "{\"code\":\"$CODE\",\"username\":\"ci-admin\",\"displayName\":\"CI\",\"password\":\"ci-salasana-123456\"}" "localhost:$2/api/auth/setup"
          done
          # the jar holds both cookies and each instance accepts its own
          curl -fsS -b jar -c jar localhost:8081/api/admin/instance >/dev/null
          curl -fsS -b jar -c jar localhost:8082/api/admin/instance >/dev/null
          curl -fsS -b jar -c jar localhost:8081/api/admin/instance >/dev/null
          INSTANCE_NAME=ci-a COMPOSE_PROJECT_NAME=ci-a HOST_PORT=8081 docker compose down -v
          INSTANCE_NAME=ci-b COMPOSE_PROJECT_NAME=ci-b HOST_PORT=8082 docker compose down -v

  ci-ok:
    # fails when any job failed, was cancelled or did not run. Skipped as a whole where the jobs are (a private push).
    if: ${{ always() && (github.event_name != 'push' || !github.event.repository.private) }}
    needs: [shell, js, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [[ $r == success ]] || exit 1; done
