name: debug-bundle
on:
  pull_request:
    paths:
      - .github/workflows/debug-bundle.yml
permissions:
  contents: read
jobs:
  regions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          sed -i 's/minify: true/minify: false/' apps/web/vite.config.ts
      - run: pnpm --filter @banking/web build
      - name: regions
        run: |
          cd apps/web/dist/assets
          for f in index-*.js ErrorCard-*.js text-*.js forecast-*.js Table-*.js messages-late-*.js; do
            echo "=== $f"
            node -e '
              const s=require("fs").readFileSync(process.argv[1],"utf8");
              const parts=s.split(/^\/\/#region /m);
              const rows=parts.slice(1).map(p=>{const i=p.indexOf("\n");return [p.length,p.slice(0,i)]}).sort((a,b)=>b[0]-a[0]);
              for(const [n,name] of rows.slice(0,40)) console.log(String(n).padStart(8),name);
              console.log("imports:", (s.match(/^import .*$/gm)||[]).join("\n"));
            ' "$f"
          done
