name: debug-bundle
on:
  pull_request:
    paths:
      - .github/workflows/debug-bundle.yml
permissions:
  contents: read
jobs:
  regions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @banking/web build
      - run: node tools/bundle-budget.mjs || true
      - run: |
          sed -i 's/minify: true/minify: false/' apps/web/vite.config.ts
          pnpm --filter @banking/web exec vite build --outDir /tmp/plain --emptyOutDir
      - name: regions
        run: |
          cd /tmp/plain/assets
          for f in index-*.js preload-helper-*.js forecast-*.js; do
            echo "=== $f"
            grep -oE '^(export )?(async )?function [A-Za-z0-9_$]+' "$f" | sed -E 's/^(export )?(async )?function //' | tr '\n' ' '
            echo
            grep -oE '^(var|const|let) [A-Za-z0-9_$]+' "$f" | sed -E 's/^(var|const|let) //' | tr '\n' ' '
            echo
          done
