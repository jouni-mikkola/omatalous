name: debug-bundle
# run 5
on:
  pull_request:
    paths:
      - .github/workflows/debug-bundle.yml
permissions:
  contents: read
jobs:
  regions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @banking/web exec vite build -c vite.debug.config.ts --outDir /tmp/dist --emptyOutDir 2>&1 | grep -aE 'CHUNK|MOD'
      - run: node tools/bundle-budget.mjs /tmp/dist || true
