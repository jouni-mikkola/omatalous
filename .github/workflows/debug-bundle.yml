name: debug-bundle
on:
  pull_request:
    paths:
      - .github/workflows/debug-bundle.yml
permissions:
  contents: read
jobs:
  regions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          sed -i 's/minify: true/minify: false/' apps/web/vite.config.ts
          pnpm --filter @banking/web exec vite build --outDir /tmp/plain --emptyOutDir
      - name: regions
        run: |
          node --input-type=module -e '
            import { firstPageScript, staticImports } from "./tools/bundle-budget.mjs";
            import { readFileSync } from "node:fs";
            const first = firstPageScript("/tmp/plain");
            console.log("TOTAL", first.raw);
            for (const p of first.parts.sort((a, b) => b.raw - a.raw)) {
              const src = readFileSync("/tmp/plain/assets/" + p.file, "utf8");
              console.log("PART", p.raw, p.file, "imports:", staticImports(src).join(" "));
              if (p.raw < 15000) continue;
              const regions = src.split("//#region ").slice(1).map((r) => { const nl = r.indexOf("\n"); return [r.slice(0, nl), r.length]; });
              regions.sort((a, b) => b[1] - a[1]);
              for (const [name, len] of regions.slice(0, 40)) console.log("   REGION", len, name);
            }
          '
