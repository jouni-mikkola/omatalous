name: full

# The heavy tier, on GitHub. No check runs on a developer's machine any more: what ci.yml leaves out runs here.
#
#   check   the whole of `pnpm check`, in eight legs side by side: knip, the privacy scan, the types and the lint; a third
#           of the test files each; a quarter of the shell suites' jobs each, with the self-tests of the tools (CI runs them always)
#   build   `pnpm build` and the bundle budgets
#   e2e     the browser tests (`pnpm e2e`) on the built app in seven legs (five parts of the app project, the route walks and the timing project alone), one retry for a flake
#   proof   tools/ci/local-proof.sh: the image, its smoke test, the container checks, the signature of the newest
#           release, an upgrade rehearsal from the public releases in tools/ci/upgrade-baselines.txt, and the drills
#   scope   decides whether proof runs: always on main and by hand; on a pull request only when it changes what the
#           proof exercises (the image and its inputs, the scripts, the migrations, the entry points, the database layer,
#           the proof's own tools and this file)
#
# A push to main, a pull request and a hand start it, like ci.yml. The repository is public, so its minutes are free.
# full-ok is the one check that says whether all the jobs passed. A proof that scope left out counts as passed, and
# only then: a failed scope, or a proof that was cancelled or failed, fails full-ok.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - relay/**
      - LICENSE
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - relay/**
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

# a newer push cancels the run of an older one on main too: each pull request passed this workflow before it merged
concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    if: ${{ github.repository == 'jouni-mikkola/omatalous' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proof: ${{ steps.scope.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does this change reach the proof
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          proof=true
          if [[ $EVENT == pull_request ]]; then
            # any failure of the diff leaves proof on
            if files=$(git diff --name-only "origin/$BASE_REF...HEAD") && [[ -n $files ]]; then
              if grep -Eq '^(Dockerfile|\.dockerignore|docker-compose[^/]*\.yml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.github/workflows/full\.yml|LICENSE|THIRD_PARTY_NOTICES|docs/RELEASING\.md|apps/server/src/(cli[^/]*|version)\.ts|(apps|packages)/[^/]+/package\.json)$|^(release|scripts|deploy|contracts|tools/ci|tools/lib|apps/server/migrations|apps/server/src/entry|apps/server/src/db|apps/server/src/platform|apps/server/test/fixtures/db)/' <<<"$files"; then
                proof=true
              else
                proof=false
              fi
            fi
          fi
          echo "proof: $proof"
          echo "proof=$proof" >>"$GITHUB_OUTPUT"

  check:
    # eight runners side by side (CHECK_SHARD, tools/check.sh): the types and the lint, the tests in three parts, the shell
    # suites in four. Together they run what `pnpm check` runs; knip and the privacy scan run once, beside the types. The
    # result of the job is success only when every leg is.
    if: ${{ github.repository == 'jouni-mikkola/omatalous' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # a red leg does not cancel the others: each names its own failures
      fail-fast: false
      matrix:
        include:
          - steps: types lint
            once: true
          - steps: tests
            shard: 1/3
          - steps: tests
            shard: 2/3
          - steps: tests
            shard: 3/3
          - steps: sh
            shard: 1/4
          - steps: sh
            shard: 2/4
          - steps: sh
            shard: 3/4
          - steps: sh
            shard: 4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Knip and the privacy scan
        if: ${{ matrix.once }}
        run: pnpm -s knip && node tools/privacy/scan.mjs --local
      - name: tools/check.sh ${{ matrix.steps }}
        id: check
        env:
          CHECK_SHARD: ${{ matrix.shard }}
        run: bash tools/check.sh ${{ matrix.steps }}
      - name: Flake or real
        if: ${{ failure() && steps.check.conclusion == 'failure' }}
        timeout-minutes: 10
        run: |
          dir=$(ls -dt "${TMPDIR:-/tmp}"/check.*/ 2>/dev/null | head -n 1)
          [[ -n $dir ]] || { echo "check: rerun: the red run kept no folder"; exit 0; }
          bash tools/check.sh --rerun "${dir%/}" || echo "check: rerun ended with $?"

  e2e:
    # seven runners with servers of their own: the app project in five parts (Playwright --shard), the route walks and the timing project alone.
    # --shard cuts the tests in file order into runs of neighbours, so the five long walks would all land in one shard: they have a project of their own.
    # Playwright keeps a project and the projects that depend on it in one shard, so --shard on both would run all in one;
    # --no-deps runs the timing project without the app project, which on its own runner it no longer shares cores with.
    if: ${{ github.repository == 'jouni-mikkola/omatalous' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            args: --project=app --shard=1/5
          - id: 2
            args: --project=app --shard=2/5
          - id: 3
            args: --project=app --shard=3/5
          - id: 4
            args: --project=app --shard=4/5
          - id: 5
            args: --project=app --shard=5/5
          - id: walks
            args: --project=walks
          - id: timing
            args: --project=timing --no-deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
      - name: Browser cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # the browser and its system libraries are installed only on a cache miss; the runner image has the libraries Chromium needs
      - name: Browser
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: pnpm e2e
        env:
          E2E_RETRY: '1'
          E2E_WORKERS: '3'
        run: pnpm e2e ${{ matrix.args }}
      # after the browser tests, so a budget over its limit does not hide their result; every leg builds the same bundle, so one runs the budgets
      - name: Bundle budgets
        if: ${{ !cancelled() && matrix.id == 1 }}
        run: pnpm budgets
      - name: Traces of the failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.id }}
          path: test-results/e2e/
          retention-days: 7
          if-no-files-found: ignore

  proof:
    needs: scope
    if: ${{ github.repository == 'jouni-mikkola/omatalous' && needs.scope.outputs.proof == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The baseline images the rehearsals build (proof-baseline:<commit>) come back from the cache, so neither the lane's
      # install nor the drills' install builds them. The cache is written once per list of baselines.
      - name: Baseline images cache
        id: baselines
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/proof-baselines.tar
          key: proof-baselines-${{ hashFiles('tools/ci/upgrade-baselines.txt') }}
      - name: Load the baseline images
        if: ${{ steps.baselines.outputs.cache-hit == 'true' }}
        run: docker load --quiet --input "$RUNNER_TEMP/proof-baselines.tar"
      - name: Image, smoke test, container checks, signature, upgrade rehearsals and drills
        # the read-only token (contents: read above) lifts the 60 an hour limit of the runner's shared address on api.github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # started as root, the proof runs the drills' own install beside the rehearsal (BESIDE in local-proof.sh): its legs run as two
        # other users, so the watchdog that counts each user's updates sees them apart. PATH and the token pass through sudo.
        run: sudo --preserve-env=GITHUB_TOKEN env "PATH=$PATH" TMPDIR=/tmp tools/ci/local-proof.sh --jobs 2 tools/ci/upgrade-baselines.txt
      - name: Keep the baseline images
        id: keep
        if: ${{ success() && steps.baselines.outputs.cache-hit != 'true' }}
        run: |
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' proof-baseline)
          if (( ${#images[@]} > 0 )); then
            docker save --output "$RUNNER_TEMP/proof-baselines.tar" "${images[@]}"
            ls -l "$RUNNER_TEMP/proof-baselines.tar"
            echo "saved=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Save the baseline images cache
        if: ${{ steps.keep.outputs.saved == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/proof-baselines.tar
          key: proof-baselines-${{ hashFiles('tools/ci/upgrade-baselines.txt') }}
      - name: Where the time of the proof went
        if: ${{ !cancelled() }}
        run: |
          for f in /tmp/local-proof.*/logs/*.log; do
            [[ -e $f ]] || continue
            grep -H '^phase ' "$f" | sed 's|^/tmp/local-proof\.[^/]*/logs/||' || true
          done
      - name: Logs of the proof
        if: ${{ failure() }}
        run: |
          for f in "${TMPDIR:-/tmp}"/local-proof.*/logs/*.log; do
            [[ -e $f ]] || continue
            echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"
          done

  full-ok:
    if: ${{ always() && github.repository == 'jouni-mikkola/omatalous' }}
    needs: [scope, check, e2e, proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.scope.result }} ${{ needs.check.result }} ${{ needs.e2e.result }}
          PROOF_NEEDED: ${{ needs.scope.outputs.proof }}
          PROOF_RESULT: ${{ needs.proof.result }}
        run: |
          echo "jobs: $RESULTS, proof needed: $PROOF_NEEDED, proof: $PROOF_RESULT"
          for r in $RESULTS; do [[ $r == success ]] || exit 1; done
          # a proof left out is fine only when scope said it was not needed
          case $PROOF_NEEDED:$PROOF_RESULT in
            true:success | false:skipped) ;;
            *) exit 1 ;;
          esac
