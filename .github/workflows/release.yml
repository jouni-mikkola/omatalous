name: Release

# A tag vX.Y.Z builds the image for amd64 and arm64, pushes it to ghcr.io, signs it by digest (keyless, through
# GitHub OIDC), verifies the signature with the identity installs pin, and writes the release notes.
# The "release" environment has no required reviewer, so the run starts when the tag is pushed. Runs only in the public repository.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  IMAGE: ghcr.io/jouni-mikkola/omatalous
  # What scripts/update.sh pins when it verifies an image. Keep in step with it (a test compares them).
  SIGN_IDENTITY_REGEXP: ^https://github\.com/jouni-mikkola/omatalous/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$
  SIGN_ISSUER: https://token.actions.githubusercontent.com

jobs:
  verify:
    # the tag, the versions in the tree and the CHANGELOG agree, and the tests pass on the tagged commit
    if: github.repository == 'jouni-mikkola/omatalous'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the versions
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG is not vX.Y.Z"; exit 1; }
          version=${TAG#v}
          app=$(sed -n 's/^export const APP_VERSION = "\(.*\)";$/\1/p' apps/server/src/version.ts)
          [[ $app == "$version" ]] || { echo "Tag $TAG but APP_VERSION is $app"; exit 1; }
          for f in apps/server/package.json apps/web/package.json packages/core/package.json; do
            v=$(node -p "require('./$f').version")
            [[ $v == "$version" ]] || { echo "$f is $v, tag is $version"; exit 1; }
          done
          top=$(sed -n 's/^## \([^ ]*\).*/\1/p' CHANGELOG.md | head -1)
          [[ $top == "$version" ]] || { echo "CHANGELOG top heading is $top, tag is $version"; exit 1; }
          [[ -n $(git tag --list "$TAG") ]] || { echo "tag missing"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "The tagged commit is not on main"; exit 1; }
      - name: Migrations only added since the previous release
        run: |
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [[ -n $prev ]]; then scripts/ci/check-migrations.sh "$prev"; else echo "first release, nothing to compare"; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    needs: verify
    if: github.repository == 'jouni-mikkola/omatalous'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose layout number
        id: compat
        run: |
          n=$(sed -n 's/^x-talous-compat: *\([0-9]*\).*/\1/p' docker-compose.yml)
          [[ -n $n ]] || { echo "x-talous-compat missing"; exit 1; }
          echo "n=$n" >>"$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ needs.verify.outputs.version }}
            COMPOSE_COMPAT=${{ steps.compat.outputs.n }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify with the identity installs pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "$SIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$SIGN_ISSUER" \
            "$IMAGE@$DIGEST" >/dev/null
          echo "Verified $IMAGE@$DIGEST" >>"$GITHUB_STEP_SUMMARY"

  release:
    needs: [verify, image]
    if: github.repository == 'jouni-mikkola/omatalous'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release itself
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md >notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG has no section for $VERSION"; exit 1; }
          {
            echo
            echo "Image: \`$IMAGE:$VERSION@$DIGEST\`"
            echo
            echo "Verify: \`cosign verify --certificate-identity-regexp '$SIGN_IDENTITY_REGEXP' --certificate-oidc-issuer $SIGN_ISSUER $IMAGE@$DIGEST\`"
          } >>notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
