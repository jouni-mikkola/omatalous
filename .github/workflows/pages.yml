name: Return page

# Publishes relay/ (the bank return page, https://jouni-mikkola.github.io/omatalous/paluu/) to the gh-pages
# branch on release tags, on a push to main that touches relay/, and by hand. Runs only in the public repository. The page is one reviewed static file, see relay/README.md. GitHub Pages
# must be set to serve the gh-pages branch (Settings > Pages), which the owner does once.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["relay/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # by hand only from the default branch, so a feature branch cannot replace the page every household trusts
    if: github.repository == 'jouni-mikkola/omatalous' && (github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        # the release workflow needs the owner's approval, this one does not, so a tag on a side branch must not publish
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "The tagged commit is not on main"; exit 1; }
      - name: Check the page
        run: |
          test -f relay/paluu/index.html
          # a page that loads anything from elsewhere does not ship
          if grep -Eiq '<script[^>]*src=|<link|<img|<iframe|https?://[a-z]' relay/paluu/index.html; then
            echo "relay/paluu/index.html references an outside resource"; exit 1
          fi
          grep -q "Content-Security-Policy" relay/paluu/index.html
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          cp -R relay/. "$out/"
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Return page from $REF"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
