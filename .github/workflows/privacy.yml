name: privacy

# What lands in the public repository reveals no personal data, no secret, nothing of the maintainer's machines and
# nothing of the add-on module (tools/privacy/scan.mjs, the rules in CLAUDE.md "The public repository"). The job
# `privacy` is a required check of main: a pull request merges only when it passed.
#
# It reads what a pull request adds (lines, paths, pictures, commit messages and the commits' addresses) and its title,
# body and branch name, and what a push to main added. Documents too: a document is where a pasted log lands. An edit of
# the title or body runs it again. A finding names its file and line and never the value: this log is public.
#
# The pull request's texts reach the script through the environment, never through the shell's text.
#
# The scanner and its word lists come from the base commit (main), never from the change: a pull request cannot weaken
# the check that judges it. One that changes tools/privacy is judged by main's copy too, so a fix of a detector merges
# before the near miss it lets through.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  privacy:
    # the public repository's check: the private one runs no workflow on its own
    if: ${{ github.repository == 'jouni-mikkola/omatalous' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          judge="$RUNNER_TEMP/privacy-judge"
          base="$BASE_SHA"
          # a base the clone does not hold (a new branch, a forced push, a manual run): the head's parent
          git cat-file -e "$base^{commit}" 2>/dev/null || base="$HEAD_SHA~1"
          rm -rf "$judge"
          git ls-tree -r --name-only "$base" -- tools/privacy | while IFS= read -r f; do
            mkdir -p "$judge/$(dirname "$f")"
            git show "$base:$f" > "$judge/$f"
          done
          node "$judge/tools/privacy/scan.mjs" --ci
